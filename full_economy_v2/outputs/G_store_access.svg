<rect class="bg" width="760" height="480" rx="8"/>
<text x="24" y="34" font-size="17" class="t1" font-weight="600">G. Wellness Store spending vs access to journeys</text>
<text x="24" y="56" font-size="12.5" class="t2">Moderate walker who shops through the Store: median day journey 100 is finished, by monthly spend and</text>
<text x="24" y="74" font-size="12.5" class="t2">reward rate. Store Chronons are worth the reward rate at the bundle price; purchases never add</text>
<text x="24" y="92" font-size="12.5" class="t2">Energy, PP or progress.</text>

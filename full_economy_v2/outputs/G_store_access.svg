<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
<title id="title">Store spending versus journey access</title>
<desc id="desc">Line chart of median days to finish journey 100 against monthly store spending, for three reward rates.</desc>

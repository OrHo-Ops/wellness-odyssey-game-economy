<rect class="bg" width="760" height="652" rx="8"/>
<text x="24" y="34" font-size="17" class="t1" font-weight="600">L. Balance sweep: how much late-game scarcity, and who feels it</text>
<text x="24" y="56" font-size="12.5" class="t2">Coverage at journey 100 is the Chronons a walking-only player earns during the journey before it,</text>
<text x="24" y="74" font-size="12.5" class="t2">divided by its price; the other anchors stay at the reference. Lower means scarcer.</text>
<text x="24" y="92" font-size="12.5" class="t2">Walking-only players start to be blocked below a coverage of about 1.0 (36% of sessions at 0.9);</text>
<text x="24" y="110" font-size="12.5" class="t2">missions and bundles keep players unblocked to about 0.8.</text>

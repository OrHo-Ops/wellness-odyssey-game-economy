<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" width="760" height="670" role="img" aria-labelledby="title desc">
<title id="title">Late-game balance sweep</title>
<desc id="desc">Two line charts against late-game coverage: share of fully blocked sessions and median wait before journey 100, by player type.</desc>

<text x="24" y="34" font-size="17" class="t1" font-weight="600">PP length per journey: three pacing scenarios</text>
<text x="24" y="56" font-size="12.5" class="t2">Journeys 1 to 7 keep their implemented costs (1,500 x 1.08^(n-1)). After that, length is a separate,</text>
<text x="24" y="74" font-size="12.5" class="t2">hypothetical pacing choice. Extending the implemented 8% growth instead would reach 3,055,224 PP at</text>
<text x="24" y="92" font-size="12.5" class="t2">journey 100, far off this chart.</text>

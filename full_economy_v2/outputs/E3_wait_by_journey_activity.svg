<text x="24" y="34" font-size="17" class="t1" font-weight="600">E3. Walking only: scarcity starts at the same journey at every activity</text>
<text x="24" y="56" font-size="17" class="t1" font-weight="600">level</text>
<text x="24" y="78" font-size="12.5" class="t2">Median wait per journey. The casual, moderate and active walkers first wait at journeys 60, 60, 61:</text>
<text x="24" y="96" font-size="12.5" class="t2">the same steps earn Energy and Chronons, so walking more changes how long a wait lasts, not where it</text>
<text x="24" y="114" font-size="12.5" class="t2">starts.</text>

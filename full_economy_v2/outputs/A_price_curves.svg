<text x="24" y="34" font-size="17" class="t1" font-weight="600">Chronon unlock price across the 100-journey World Tour</text>
<text x="24" y="56" font-size="12.5" class="t2">Five hypothetical price families. Each charges the same total, 7,443 Chronons for journeys 2 to 100;</text>
<text x="24" y="74" font-size="12.5" class="t2">they differ only in when they charge it. Jerusalem is the free start journey. Prices are calibrated</text>
<text x="24" y="92" font-size="12.5" class="t2">once and then frozen.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc">
<title id="title">Puzzle completion and PP acceleration</title>
<desc id="desc">Two horizontal bar charts: puzzles completed per year and days saved to journey 50 by the puzzle completion Energy, by mission participation.</desc>

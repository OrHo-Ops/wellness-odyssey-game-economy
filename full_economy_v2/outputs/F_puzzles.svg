<text x="24" y="352" font-size="11" class="mu">Completion Energy is 1.8% to 3.0% of all Energy credited. Once a player is Chronon-bound it no longer speeds the</text>
<text x="24" y="367" font-size="11" class="mu">tour.</text>
<text x="24" y="382" font-size="11" class="mu">Synthetic players; every economy value is hypothetical. Data: full_economy_v2/outputs/puzzles.csv</text>

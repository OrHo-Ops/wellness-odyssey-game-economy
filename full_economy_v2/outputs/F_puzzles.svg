<rect class="bg" width="760" height="400" rx="8"/>
<text x="24" y="34" font-size="17" class="t1" font-weight="600">F. Puzzle completion and its effect on PP progression</text>
<text x="24" y="56" font-size="12.5" class="t2">Moderate walker, one Future Vision puzzle per destination (Jaffa Gate's provisional 9 tiles x 30</text>
<text x="24" y="74" font-size="12.5" class="t2">pieces and 100 Energy, generalised as a labelled assumption), 5 organic pieces per 1,000 steps.</text>
<text x="24" y="92" font-size="12.5" class="t2">Right: how many days the completion Energy brings journey 50 forward.</text>
<text x="196" y="128" font-size="12" class="t2" font-weight="600">Completion frequency</text>
<text x="560" y="128" font-size="12" class="t2" font-weight="600">PP acceleration</text>
<line class="axis" x1="196" y1="140" x2="196" y2="306"/>
<line class="grid" x1="246" y1="140" x2="246" y2="306"/>

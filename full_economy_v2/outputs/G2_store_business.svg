<rect class="bg" width="760" height="460" rx="8"/>
<text x="24" y="34" font-size="17" class="t1" font-weight="600">G2. Does commission pay for the Chronons? Net contribution per $45 order</text>
<text x="24" y="56" font-size="12.5" class="t2">Commission on kept orders, minus the bundle revenue the awarded Chronons displace (net of a 30%</text>
<text x="24" y="74" font-size="12.5" class="t2">platform fee) and $0.15 handling. Left: half of store Chronons displace bundle purchases. Right: all</text>
<text x="24" y="92" font-size="12.5" class="t2">of them do. Dots mark the break-even reward rate.</text>
<rect class="o1" x="24" y="115" width="16" height="4" rx="2"/>
<text x="46" y="121" font-size="12" class="t2">4% commission</text>

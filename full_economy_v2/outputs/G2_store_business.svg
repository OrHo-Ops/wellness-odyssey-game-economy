<text x="300.7" y="121" font-size="12" class="t2">12% commission</text>
<text x="72" y="148" font-size="12" class="t2" font-weight="600">50% of store Chronons displace bundles</text>
<text x="440" y="148" font-size="12" class="t2" font-weight="600">100% displace bundles</text>
